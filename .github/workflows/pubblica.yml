name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    # ogni notte poco dopo mezzanotte (ora italiana): sposta gli eventi passati e aggiorna i dati per Google
    - cron: "10 23 * * *"
    # ogni ora: aggiorna lo storico delle notifiche inviate dal sito di OneSignal
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache immagini ottimizzate
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('media/**') }}
          restore-keys: img-
      - name: Costruisci il sito
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          NOINDEX: ${{ vars.NOINDEX }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Mantieni attivo l'aggiornamento notturno
        # GitHub sospende i lavori pianificati dopo 60 giorni senza modifiche: questo li tiene attivi
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pubblica.yml/enable" || true

  notifica:
    # Dopo la pubblicazione: avvisa con una notifica chi ha attivato le notifiche, solo per gli eventi NUOVI
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cerca eventi aggiunti
        id: nuovi
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo "files=" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- contenuti/eventi/ | tr '\n' ' ')
          echo "Eventi aggiunti: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.nuovi.outputs.files != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.nuovi.outputs.files != ''
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.nuovi.outputs.files != ''
        with:
          path: .cache/img
          key: img-${{ hashFiles('media/**') }}
          restore-keys: img-
      - name: Invia la notifica
        if: steps.nuovi.outputs.files != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          NOINDEX: ${{ vars.NOINDEX }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python notifica.py ${{ steps.nuovi.outputs.files }}
      - name: Aggiorna lo storico sul sito
        if: steps.nuovi.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: sleep 20 && gh workflow run pubblica.yml --ref main || true

  notifiche-pannello:
    # Notifiche scritte nel pannello (sezione "Notifiche"): invio subito o programmato, poi aggiorna lo stato
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cerca notifiche salvate o eliminate
        id: file
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo "salvati=" >> "$GITHUB_OUTPUT"; echo "eliminati=" >> "$GITHUB_OUTPUT"; exit 0; fi
          S=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'contenuti/notifiche/*.yml' | tr '\n' ' ')
          E=$(git diff --name-only --diff-filter=D "$BEFORE" "${{ github.sha }}" -- 'contenuti/notifiche/*.yml' | tr '\n' ' ')
          echo "Salvate: $S / Eliminate: $E"
          echo "salvati=$S" >> "$GITHUB_OUTPUT"
          echo "eliminati=$E" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.file.outputs.salvati != '' || steps.file.outputs.eliminati != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.file.outputs.salvati != '' || steps.file.outputs.eliminati != ''
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.file.outputs.salvati != '' || steps.file.outputs.eliminati != ''
        with:
          path: .cache/img
          key: img-${{ hashFiles('media/**') }}
          restore-keys: img-
      - name: Invia o programma
        if: steps.file.outputs.salvati != '' || steps.file.outputs.eliminati != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          NOINDEX: ${{ vars.NOINDEX }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          ELENCO_MODIFICATI: modificati.txt
        run: python notifiche_pannello.py --salvati ${{ steps.file.outputs.salvati }} --eliminati ${{ steps.file.outputs.eliminati }}
      - name: Aggiorna lo stato nel pannello
        if: steps.file.outputs.salvati != ''
        run: |
          if [ -s modificati.txt ]; then
            git config user.name "AREA30 notifiche"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(cat modificati.txt)
            git commit -m "Stato notifiche aggiornato" || exit 0
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
      - name: Aggiorna lo storico sul sito
        if: steps.file.outputs.salvati != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: sleep 20 && gh workflow run pubblica.yml --ref main || true
